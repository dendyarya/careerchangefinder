# Deploy careerchangefinder.com (docs/deploy.md).
#   push to "staging"                  -> staging.careerchangefinder.com (password-protected, noindex)
#   Actions > Deploy > Run workflow on "main" -> careerchangefinder.com (manual only: pushing to main
#   never changes the live site by itself; the "production" environment only accepts the main branch)
# Actions are pinned to commit SHAs (runbook: Keamanan website, part 2).
name: Deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref_name == 'staging' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SITE_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      NEXT_TELEMETRY_DISABLED: "1"
      # public IDs, baked into the static pages; set as environment variables (not secrets) on "production"
      ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      # Keystatic GitHub App slug (public; set as a variable on "staging" only, see docs/deploy.md)
      NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.KEYSTATIC_GITHUB_APP_SLUG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          npm ci
          pip install -r scripts/etl/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Security audit (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Type check, lint, unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Check data against the official sources
        run: |
          python scripts/etl/download.py
          python scripts/etl/verify.py
          python scripts/etl/verify_situations.py
          python scripts/etl/verify_short_names.py
          python scripts/etl/verify_tests.py
          python scripts/etl/verify_studies.py

      - name: Build
        run: npm run build

      - name: Check built pages (SEO basics and numbers vs data)
        run: npm run qa

      - name: Check on-demand pages and sitemaps (read-only build, like the server)
        run: |
          set -euo pipefail
          cp -r .next/static .next/standalone/.next/ && cp -r public .next/standalone/
          chmod -R a-w .next/standalone
          (cd .next/standalone && PORT=3299 HOSTNAME=127.0.0.1 node server.js > ../../server.log 2>&1 &)
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3299/ && break; sleep 1; done
          python scripts/qa/check_state_pages.py http://127.0.0.1:3299 300
          python scripts/qa/check_sitemaps.py http://127.0.0.1:3299
          chmod -R u+w .next/standalone
          rm -rf .next/standalone/.next/static .next/standalone/public

      - name: Assemble release with checksums
        run: |
          set -euo pipefail
          R=release
          cp -r .next/standalone "$R"
          mkdir -p "$R/.next"
          cp -r .next/static "$R/.next/static"
          cp -r public "$R/public"
          rm -rf "$R/.next/cache"
          echo "$GITHUB_SHA" > "$R/RELEASE"
          (cd "$R" && find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          du -sh "$R"

      - name: Upload to the VPS and activate
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy -p $PORT -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          # The deploy key can only rsync into the releases folder and run "activate" (deploy/server/ccf-gate)
          ID="$GITHUB_SHA-$GITHUB_RUN_ID"
          rsync -rlptz --chmod=Du=rwx,Dgo=,Fu=rw,Fgo= -e "$SSH" release/ "$USER@$HOST:$SITE_ENV/releases/$ID/"
          $SSH "$USER@$HOST" "activate $SITE_ENV $ID"
          rm -f ~/.ssh/deploy
