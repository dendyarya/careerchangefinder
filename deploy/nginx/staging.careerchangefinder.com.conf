# /etc/nginx/sites-available/staging.careerchangefinder.com  (staging only; other sites untouched)
server {
    listen 80;
    listen [::]:80;
    server_name staging.careerchangefinder.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.careerchangefinder.com;

    # Cloudflare Origin Certificate (covers careerchangefinder.com and *.careerchangefinder.com)
    ssl_certificate     /etc/ssl/careerchangefinder/origin.pem;
    ssl_certificate_key /etc/ssl/careerchangefinder/origin.key;

    # staging is private and never indexed
    auth_basic           "Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-ccf-staging;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;
    access_log /var/log/nginx/ccf-staging.access.log;
    error_log  /var/log/nginx/ccf-staging.error.log;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
