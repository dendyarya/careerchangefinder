# /etc/nginx/sites-available/careerchangefinder.com  (production; other sites untouched)
# Cloudflare proxies the domain (SSL mode "Full (strict)"); this server only answers with the
# Cloudflare Origin Certificate. www and plain HTTP go to https://careerchangefinder.com.

server {
    listen 80;
    listen [::]:80;
    server_name careerchangefinder.com www.careerchangefinder.com;
    return 301 https://careerchangefinder.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.careerchangefinder.com;
    ssl_certificate     /etc/ssl/careerchangefinder/origin.pem;
    ssl_certificate_key /etc/ssl/careerchangefinder/origin.key;
    return 301 https://careerchangefinder.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name careerchangefinder.com;

    ssl_certificate     /etc/ssl/careerchangefinder/origin.pem;
    ssl_certificate_key /etc/ssl/careerchangefinder/origin.key;

    # visitor IPs from Cloudflare (file written by setup-vps.sh from cloudflare.com/ips-v4 and ips-v6)
    include /etc/nginx/snippets/ccf-cloudflare-realip.conf;

    client_max_body_size 2m;
    access_log /var/log/nginx/ccf-production.access.log;
    error_log  /var/log/nginx/ccf-production.error.log;

    # the CMS admin is not used on production unless its GitHub App is set up (lib/keystatic-enabled.ts)
    location ^~ /keystatic { return 404; }
    location ^~ /api/keystatic { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
